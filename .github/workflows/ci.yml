name: ci
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # dist/ is committed and consumers use it as it is: it must be exactly what src/ builds to.
      - run: npm run check:dist
      - run: npm run build:kernel -- --check
